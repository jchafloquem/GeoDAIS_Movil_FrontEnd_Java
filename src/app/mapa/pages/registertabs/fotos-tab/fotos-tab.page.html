<ion-content class="fotos-content">
  <ng-container *ngIf="registerDataService.formData$ | async as formData">
  <ng-container *ngIf="registerDataService.photosForDisplay$ | async as photosForDisplay">
    <ion-card class="fotos-card">
      <ion-card-header>
        <ion-card-title class="tab-card-title">
          Registro fotográfico
          <ion-icon *ngIf="formData.uploaded" name="lock-closed" aria-label="Registro bloqueado"></ion-icon>
        </ion-card-title>
        <ion-card-subtitle>Fuente: LEVANTAMIENTO EN CAMPO</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-list class="photo-list">
          <ion-list-header class="photo-list-header">
            <ion-label>Fotos Adicionales ({{ photosForDisplay.length }} / 6)</ion-label>
            <ion-note slot="end" color="primary">Mínimo 2</ion-note>
          </ion-list-header>
        </ion-list>
        <!-- Cuadrícula de fotos -->
        <div class="photo-grid">
          <!-- Itera 6 veces para crear 6 espacios para fotos -->
          <div *ngFor="let i of [0, 1, 2, 3, 4, 5]" class="photo-container">
            <div
              class="photo-box"
              role="button"
              tabindex="0"
              [attr.aria-label]="photosForDisplay[i] ? 'Ver foto ' + (i + 1) : 'Añadir foto ' + (i + 1)"
              [attr.aria-disabled]="formData.uploaded && !photosForDisplay[i]"
              [class.add-photo-box]="!photosForDisplay[i]"
              [class.disabled-box]="formData.uploaded && !photosForDisplay[i]"
              (click)="photosForDisplay[i] ? openViewer(i) : (!formData.uploaded && registerDataService.takePicture())"
              (keydown.enter)="photosForDisplay[i] ? openViewer(i) : (!formData.uploaded && registerDataService.takePicture())"
              (keydown.space)="photosForDisplay[i] ? openViewer(i) : (!formData.uploaded && registerDataService.takePicture())"
            >
              <ng-container *ngIf="photosForDisplay[i] as photoSrc; else addPhotoContent">
                <!-- Contenido para una foto existente -->
                <img [src]="photoSrc" [alt]="'Foto ' + (i + 1)" />
              </ng-container>

              <ng-template #addPhotoContent>
                <!-- Contenido para un espacio vacío (añadir foto) -->
                <ion-icon name="camera-outline"></ion-icon>
                <ion-label>Añadir Foto</ion-label>
              </ng-template>
            </div>

            <!-- Botón de eliminar, solo visible si la foto existe -->
            <ion-button *ngIf="photosForDisplay[i] && !formData.uploaded" fill="clear" color="danger" size="small" class="delete-photo-btn" (click)="deletePhoto(i, $event)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-button>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Visor de imágenes a pantalla completa (Modal) -->
    <ion-modal [isOpen]="isViewerOpen" (didDismiss)="closeViewer()">
      <ng-template>
        <div class="viewer-container">
          <ion-button fill="clear" class="close-viewer-btn" aria-label="Cerrar visor de fotos" (click)="closeViewer()">
            <ion-icon slot="icon-only" name="close"></ion-icon>
          </ion-button>
          <swiper-container *ngIf="photosForDisplay.length > 0" class="viewer-swiper" [options]="viewerSlideOpts" [zoom]="true" [initialSlide]="viewerSlideOpts.initialSlide">
            <swiper-slide *ngFor="let photo of photosForDisplay">
              <div class="swiper-zoom-container">
                <img [src]="photo" />
              </div>
            </swiper-slide>
          </swiper-container>
        </div>
      </ng-template>
    </ion-modal>
  </ng-container>
  </ng-container>
</ion-content>
