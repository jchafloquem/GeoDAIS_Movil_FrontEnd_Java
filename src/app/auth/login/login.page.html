<ion-content [fullscreen]="true">
  <div class="login-container">
    <div class="login-brand">
      <ion-img src="/assets/img/logoapp.png" alt="GeoDAIS"></ion-img>
    </div>

    <ion-card class="rounded-card">
      <ion-card-header class="login-card-header">
        <span class="login-eyebrow">GESTIÓN EN CAMPO</span>
        <ion-card-title class="ion-text-center">Bienvenido de nuevo</ion-card-title>
        <ion-card-subtitle class="ion-text-center">Accede a tu cuenta GeoDAIS</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <form [formGroup]="formLogin" (ngSubmit)="login()">
          <ion-list class="login-fields">
            <ion-item>
              <ion-input label="Correo electrónico" labelPlacement="floating" type="email" name="email" formControlName="email" placeholder="correo@gmail.com" autocomplete="email"></ion-input>
            </ion-item>
            <ion-item>
              <ion-input [type]="passwordType" label="Contraseña" labelPlacement="floating" formControlName="password" placeholder="Ingresa tu contraseña" autocomplete="current-password"></ion-input>
              <ion-buttons slot="end">
                <ion-button type="button" (click)="togglePassword()" fill="clear" class="password-toggle" [attr.aria-label]="passwordType === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'">
                  <ion-icon [name]="passwordIcon" slot="icon-only"></ion-icon>
                </ion-button>
              </ion-buttons>
            </ion-item>
          </ion-list>
          <ion-button
              expand="block"
              type="submit"
              [disabled]="formLogin.invalid"
              class="ion-margin-top login-button">
              Iniciar sesión
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
