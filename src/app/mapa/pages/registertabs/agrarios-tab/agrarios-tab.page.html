<ion-content class="agrarios-content">
  <ng-container *ngIf="registerDataService.formData$ | async as formData">
    <ion-card class="agrarios-card">
      <ion-card-header color="primary">
        <ion-card-title color="white" class="tab-card-title">
          Datos Agrarios
          <ion-icon *ngIf="formData.uploaded" name="lock-closed" aria-label="Registro bloqueado"></ion-icon>
        </ion-card-title>
        <ion-card-subtitle color="white">Fuente: MIDAGRI</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-list lines="none">
          <ion-item class="data-field">
            <ion-input label="Código Autogenerado" label-placement="stacked" type="text" name="CODIGO_AUTOGENERADO_MIDAGRI" [(ngModel)]="formData.CODIGO_AUTOGENERADO_MIDAGRI" [readonly]="true" [disabled]="!!formData.uploaded"></ion-input>
          </ion-item>
          <ion-item class="data-field">
            <ion-input label="Fecha de Registro" label-placement="stacked" type="text" name="FECHA_REGISTRO_MIDAGRI" [value]="formData.FECHA_REGISTRO_MIDAGRI | date:'dd/MM/yyyy':'UTC'" [readonly]="true" [disabled]="!!formData.uploaded"></ion-input>
          </ion-item>
          <ion-item class="data-field">
            <ion-input label="Actividad Agraria" label-placement="stacked" type="text" name="ACTIVIDAD_AGRARIA" [(ngModel)]="formData.ACTIVIDAD_AGRARIA" [readonly]="true" [disabled]="!!formData.uploaded"></ion-input>
          </ion-item>
          <ion-item class="data-field">
            <ion-input label="Superficie (ha)" label-placement="stacked" type="text" name="SUPERFICIE_MIDAGRI" [(ngModel)]="formData.SUPERFICIE_MIDAGRI" [readonly]="true" [disabled]="!!formData.uploaded"></ion-input>
          </ion-item>
          <ion-item class="data-field">
            <ion-input label="Régimen de Tenencia" label-placement="stacked" type="text" name="REGIMEN_TENENCIA" [(ngModel)]="formData.REGIMEN_TENENCIA" [readonly]="true" [disabled]="!!formData.uploaded"></ion-input>
          </ion-item>
          <ion-item class="data-field">
            <ion-input label="Sexo" label-placement="stacked" type="text" name="SEXO" [(ngModel)]="formData.SEXO" [readonly]="true" [disabled]="!!formData.uploaded"></ion-input>
          </ion-item>
          <ion-item class="data-field">
            <ion-input label="Departamento" label-placement="stacked" type="text" name="MIDAGRI_DEPARTAMENTO" [(ngModel)]="formData.MIDAGRI_DEPARTAMENTO" [readonly]="true" [disabled]="!!formData.uploaded"></ion-input>
          </ion-item>
          <ion-item class="data-field">
            <ion-input label="Provincia" label-placement="stacked" type="text" name="MIDAGRI_PROVINCIA" [(ngModel)]="formData.MIDAGRI_PROVINCIA" [readonly]="true" [disabled]="!!formData.uploaded"></ion-input>
          </ion-item>
          <ion-item class="data-field">
            <ion-input label="Distrito" label-placement="stacked" type="text" name="MIDAGRI_DISTRITO" [(ngModel)]="formData.MIDAGRI_DISTRITO" [readonly]="true" [disabled]="!!formData.uploaded"></ion-input>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
  </ng-container>
</ion-content>
