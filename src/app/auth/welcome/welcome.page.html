<ion-content [fullscreen]="true" class="welcome-content">
  <main class="welcome-page">
    <header class="brand">
      <ion-img
        class="brand-logo"
        src="/assets/img/logoapp.png"
        alt="GeoDAIS"
      ></ion-img>
    </header>

    <section class="welcome-hero" aria-labelledby="welcome-title">
      <div class="hero-illustration">
        <ion-img
          src="/assets/img/welcome.png"
          alt="Profesional registrando información de campo en un mapa"
        ></ion-img>
      </div>

      <div class="welcome-copy">
        <span class="eyebrow">GESTIÓN EN CAMPO</span>
        <h1 id="welcome-title">Tu trabajo de campo, <span>más simple</span></h1>
        <p>
          Registra información y evidencias desde tu dispositivo móvil, de
          forma ágil, precisa y organizada.
        </p>
      </div>
    </section>

    <div class="feature-tags" aria-label="Funciones de GeoDAIS">
      <span><i aria-hidden="true"></i>Ubicación precisa</span>
      <span><i aria-hidden="true"></i>Datos organizados</span>
    </div>

    <footer class="welcome-actions">
      <ion-button
        class="login-button"
        routerLink="/login"
        expand="block"
        shape="round"
      >
        Iniciar sesión
      </ion-button>
      <ion-button
        class="register-button"
        routerLink="/register"
        expand="block"
        shape="round"
        fill="outline"
      >
        Registrar en el GeoDAIS
      </ion-button>
      <p class="app-version">GeoDAIS <span>·</span> v1.0.0</p>
    </footer>
  </main>
</ion-content>
