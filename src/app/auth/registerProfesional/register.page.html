<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="back-circle-button" (click)="goBack()">
        <ion-icon name="arrow-back-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ isProfileRegistered ? 'Mi Perfil' : 'Registro de Perfil' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="register-container">
    <ion-card class="profile-card">
      <ion-card-header class="profile-card-header">
        <span class="profile-eyebrow">GEO DAIS</span>
        <ion-card-title class="ion-text-center">
          {{ isProfileRegistered ? 'DATOS DEL USUARIO' : 'COMPLETA TU PERFIL' }}
        </ion-card-title>
        <p class="profile-intro">
          {{ isProfileRegistered ? 'Información de tu cuenta' : 'Ingresa tus datos para comenzar' }}
        </p>
      </ion-card-header>

      <ion-card-content>
        <form
          [formGroup]="profileForm"
          (ngSubmit)="!isProfileRegistered && saveProfile()">
          <ion-list>
            <ion-item>
              <ion-input
                label="DNI"
                labelPlacement="floating"
                type="tel"
                formControlName="dni"
                placeholder="Ingresa tu DNI"
                maxlength="8"
                required
              ></ion-input>
            </ion-item>

            <ion-item>
              <ion-input
                label="Nombres"
                labelPlacement="floating"
                type="text"
                formControlName="nombres"
                placeholder="Ingresa tus nombres"
                required
                style="text-transform: uppercase;"
              ></ion-input>
            </ion-item>

            <ion-item>
              <ion-input
                label="Apellido Paterno"
                labelPlacement="floating"
                type="text"
                formControlName="apellidoPaterno"
                placeholder="Ingresa tu apellido paterno"
                required
                style="text-transform: uppercase;"
              ></ion-input>
            </ion-item>

            <ion-item>
              <ion-input
                label="Apellido Materno"
                labelPlacement="floating"
                type="text"
                formControlName="apellidoMaterno"
                placeholder="Ingresa tu apellido materno"
                required
                style="text-transform: uppercase;"
              ></ion-input>
            </ion-item>

            <ion-item>
              <ion-input
                label="Celular"
                labelPlacement="floating"
                type="tel"
                formControlName="celular"
                placeholder="Ej: 987654321"
                required
              ></ion-input>
            </ion-item>

            <ion-item>
              <ion-input
                label="Correo Electrónico"
                labelPlacement="floating"
                type="email"
                formControlName="email"
                placeholder="tu@correo.com"
                required
              ></ion-input>
            </ion-item>
          </ion-list>

          <ion-button
            *ngIf="!isProfileRegistered"
            class="profile-submit"
            expand="block"
            shape="round"
            type="submit"
            [disabled]="profileForm.invalid"
            color="primary"
          >
            REGISTRARSE EN EL APLICATIVO
          </ion-button>

          <ion-button
            *ngIf="isProfileRegistered"
            class="profile-submit"
            expand="block"
            shape="round"
            (click)="goToLogin()"
            color="primary"
          >
            Ir al Login
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
