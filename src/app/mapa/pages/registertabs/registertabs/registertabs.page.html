<ion-header>
  <ion-toolbar class="register-toolbar" color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/mapa"></ion-back-button>
    </ion-buttons>
    <ion-title class="register-page-title">
      <ion-icon class="register-mode-icon" [name]="(registerDataService.editKey$ | async) ? 'pencil-outline' : 'create-outline'" aria-hidden="true"></ion-icon>
      {{ pageTitle$ | async }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button class="register-save-button" (click)="save()" color="light" aria-label="Guardar registro" title="Guardar registro">
        <ion-icon slot="icon-only" name="save-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-tabs class="register-tabs-content">
  <ion-tab-bar slot="bottom" class="register-tab-bar">
    <ion-tab-button tab="productor" class="tab-productor">
      <ion-icon class="register-tab-icon" name="person-outline"></ion-icon>
      <ion-label>Productor</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="agrarios" class="tab-agrarios">
      <ion-icon class="register-tab-icon" name="leaf-outline"></ion-icon>
      <ion-label>Agrarios</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="geometricos" class="tab-geometricos">
      <ion-icon class="register-tab-icon" name="shapes-outline"></ion-icon>
      <ion-label>Geometría</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="fotos" class="tab-fotos">
      <ion-icon class="register-tab-icon" name="camera-outline"></ion-icon>
      <ion-label>Fotos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profesional-tab" class="tab-profesional">
      <ion-icon class="register-tab-icon" name="id-card-outline"></ion-icon>
      <ion-label>Profesional</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
